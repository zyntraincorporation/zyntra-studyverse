services:
  - type: web
    name: zyntra-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # Set manually in Render dashboard
      - key: DIRECT_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false        # Set manually in Render dashboard
      - key: APP_PIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: "http://localhost:5173,https://zyntra-studyverse.netlify.app"
    autoDeploy: true
